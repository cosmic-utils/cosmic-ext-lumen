[package]
name = "cosmic-ext-lemmy"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "A native Lemmy reader for the COSMIC desktop"
repository = "https://github.com/cosmic-utils/cosmic-ext-lemmy"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", rev = "8fa46ccd444ca6521ce247ef62c63f9e207348e5", features = ["markdown", "wgpu"] }
lemmy_api_common = { version = "=0.19.21", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
open = "5"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[profile.dev]
debug = 0

