[package]
name = "cosmic-ext-lumen"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Lumen, a native Lemmy client for the COSMIC desktop"
repository = "https://github.com/cosmic-utils/cosmic-ext-lemmy"

[dependencies]
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
rust-embed = "8"
libcosmic = { git = "https://github.com/pop-os/libcosmic", features = ["markdown", "wgpu", "xdg-portal"] }
lemmy_api_common = { version = "=0.19.21", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
open = "5"
url = "2"

keyring = { version = "4.2", features = ["v1"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[build-dependencies]
xdgen = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[profile.dev]
debug = 0

